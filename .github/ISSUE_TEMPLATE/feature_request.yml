name: Feature request
description: Suggest an idea for Stride
title: "[Feature] "
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, please check the roadmap in the README and search existing issues.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need, not just the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the app local-first (no account, no cloud).
          required: false
