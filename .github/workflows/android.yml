name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Decodes the one stable signing key from repository secrets. Without this, each run
      # would generate a fresh debug key and Android would refuse to install over the last
      # build. Falls back cleanly when no key is configured.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STRIDE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STRIDE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STRIDE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STRIDE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No signing key configured — the default debug keystore will be used."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/stride.p12"
          {
            echo "STRIDE_KEYSTORE_PATH=$RUNNER_TEMP/signing/stride.p12"
            echo "STRIDE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "STRIDE_KEY_ALIAS=$KEY_ALIAS"
            echo "STRIDE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing key ready."

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Prints the signer fingerprint so a human can confirm every build shares one identity.
      - name: Verify the APK signing certificate
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs "$APK" | grep -iE "SHA-256" || true
          else
            echo "apksigner not found; skipping fingerprint check."
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: stride-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
